name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Lint Frontend
      run: npm run lint --workspace=frontend

    - name: Build Frontend
      run: npm run build --workspace=frontend

    - name: Build Backend
      run: npm run build --workspace=backend
      
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy (Optional)
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set. Skipping manual trigger."
            echo "Note: If you connected GitHub natively in your Render Dashboard using the Blueprint (render.yaml), Render already auto-deploys on push!"
          else
            curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
            echo "Triggered Render Pipeline!"
          fi
