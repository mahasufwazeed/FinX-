databases:
  - name: finx-db
    databaseName: finx
    user: finx
    plan: free

services:
  - type: web
    name: finx-backend
    env: node
    plan: free
    buildCommand: rm -rf node_modules package-lock.json && npm install && npm run build --workspace=backend && npm run db:push --workspace=backend
    startCommand: npm run start --workspace=backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finx-db
          property: connectionString
      - key: PORT
        value: "5000"
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: finx-frontend
    env: node
    plan: free
    buildCommand: npm install && npm run build --workspace=frontend
    startCommand: npm run start --workspace=frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: finx-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: PORT
        value: "3000"
